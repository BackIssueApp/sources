# One zip per site, attached to the tagged release, so a site can be installed
# on its own. The app's catalog points at these assets by name.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Release notes come from the tagged version's CHANGELOG.md section.
name: Release bundles

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build one zip per site
        run: |
          mkdir -p dist
          for dir in */; do
            id="${dir%/}"
            [ -f "$id/index.js" ] || continue
            (cd "$id" && zip -r "../dist/$id.zip" . -x '*.git*' 'node_modules/*')
            echo "packed $id"
          done
          ls -l dist

      - name: Release notes from the changelog
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Download sites for BackIssue." > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: notes.md
